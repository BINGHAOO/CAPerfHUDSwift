name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-app:
    name: Build CAPerfHUDSwift .tipa
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install ldid
        run: brew install ldid

      - name: Make build script executable
        run: chmod +x ipabuild.sh

      - name: Build .tipa (Release)
        run: ./ipabuild.sh

      - name: Verify .tipa was produced
        run: |
          ls -la build/CAPerfHUDSwift.tipa
          test -f build/CAPerfHUDSwift.tipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAPerfHUDSwift-tipa
          path: build/CAPerfHUDSwift.tipa
          if-no-files-found: error

  build-tweak:
    name: Build CAPerfHUDOverlay .deb
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          # Theos provides its own SDK setup; ensure ldid is present.
          brew install ldid

      - name: Build tweak .deb
        run: |
          cd tweak
          make package FINALPACKAGE=1 THEOS=$HOME/theos

      - name: Find .deb
        id: find-deb
        run: |
          DEB_PATH=$(find tweak/packages -name "*.deb" | head -n 1)
          echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT
          ls -la "$DEB_PATH"

      - name: Upload tweak artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAPerfHUDOverlay-deb
          path: ${{ steps.find-deb.outputs.deb_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-app, build-tweak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download .tipa artifact
        uses: actions/download-artifact@v4
        with:
          name: CAPerfHUDSwift-tipa

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: CAPerfHUDOverlay-deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CAPerfHUDSwift.tipa
            *.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
