name: Build & Release .tipa

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build CAPerfHUDSwift .tipa
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install ldid
        run: |
          brew install ldid

      - name: Make build script executable
        run: chmod +x ipabuild.sh

      - name: Build .tipa (Release)
        run: ./ipabuild.sh

      - name: Verify .tipa was produced
        run: |
          ls -la build/CAPerfHUDSwift.tipa
          test -f build/CAPerfHUDSwift.tipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAPerfHUDSwift-tipa
          path: build/CAPerfHUDSwift.tipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download .tipa artifact
        uses: actions/download-artifact@v4
        with:
          name: CAPerfHUDSwift-tipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CAPerfHUDSwift.tipa
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
