name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build TrollStore .tipa + Jailbreak .deb
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install ldid & Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install roothide Theos
        run: git clone --recursive https://github.com/roothide/theos.git $HOME/theos-roothide

      - name: Build TrollStore edition (.tipa)
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Verify .tipa
        run: |
          ls -la build/CAPerfHUD-TrollStore.tipa
          test -f build/CAPerfHUD-TrollStore.tipa

      - name: Build Jailbreak edition app (.app)
        run: ./ipabuild.sh --jailbreak

      - name: Verify jailbreak .app
        run: |
          ls -la build/CAPerfHUDSwift.app
          test -d build/CAPerfHUDSwift.app

      - name: Build rootful .deb (unc0ver / palera1n rootful)
        run: |
          cd tweak
          make package FINALPACKAGE=1 THEOS=$HOME/theos
          mv packages/*.deb ../build/CAPerfHUD-rootful.deb

      - name: Build rootless .deb (Dopamine / palera1n rootless)
        run: |
          cd tweak
          make clean THEOS=$HOME/theos
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1 THEOS=$HOME/theos
          mv packages/*.deb ../build/CAPerfHUD-rootless.deb

      - name: Build roothide .deb (roothide bootstrap)
        run: |
          cd tweak
          make clean THEOS=$HOME/theos-roothide
          # roothide scheme (not rootless!): loads the roothide vendor module,
          # forces package arch iphoneos-arm64e, skips libroot and packages
          # with standard paths so roothide's dpkg remaps them into jbroot.
          # Packages built this way install directly in roothide Sileo.
          THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1 THEOS=$HOME/theos-roothide
          mv packages/*.deb ../build/CAPerfHUD-roothide.deb

      - name: Verify packages
        run: |
          ls -la build/CAPerfHUD-rootful.deb build/CAPerfHUD-rootless.deb build/CAPerfHUD-roothide.deb
          for f in build/CAPerfHUD-*.deb; do
            echo "== $f =="
            ar t "$f"
          done

      - name: Upload TrollStore .tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAPerfHUD-TrollStore-tipa
          path: build/CAPerfHUD-TrollStore.tipa
          if-no-files-found: error

      - name: Upload Jailbreak .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CAPerfHUD-Jailbreak-debs
          path: |
            build/CAPerfHUD-rootful.deb
            build/CAPerfHUD-rootless.deb
            build/CAPerfHUD-roothide.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download TrollStore .tipa artifact
        uses: actions/download-artifact@v4
        with:
          name: CAPerfHUD-TrollStore-tipa

      - name: Download Jailbreak .deb artifacts
        uses: actions/download-artifact@v4
        with:
          name: CAPerfHUD-Jailbreak-debs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CAPerfHUD-TrollStore.tipa
            CAPerfHUD-rootful.deb
            CAPerfHUD-rootless.deb
            CAPerfHUD-roothide.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
